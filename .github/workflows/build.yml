name: Build Xperia 1 V Kernel

on:
  workflow_dispatch:
    inputs:
      variant:
        description: '构建变体 (gki/consolidate)'
        required: false
        default: 'gki'
  push:
    branches: [master]

jobs:
  build-kernel:
    name: Build Kernel (5.15.170 + ReSukiSU + SUSFS)
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            bc bison flex cpio git libssl-dev libelf-dev \
            python3 python3-pip device-tree-compiler \
            gcc g++ make rsync zip zstd lz4 xz-utils \
            openssl dwarves libncurses-dev ccache \
            curl wget dosfstools mtools
          python3 -m pip install --quiet pyelftools
          echo "--- 环境 ---"
          gcc --version | head -1
          make --version | head -1
          nproc
          df -h / | tail -1

      - name: Prepare host sysroot (kernel build-tools)
        run: |
          SYSROOT=kernel_platform/build/kernel/build-tools/sysroot
          sudo mkdir -p $SYSROOT
          if [ ! -L $SYSROOT/usr ]; then
            sudo ln -sfn /usr $SYSROOT/usr
          fi
          # build-tools bin 软链(官方脚本需要)
          BT=kernel_platform/build/kernel/build-tools/path/linux-x86
          sudo mkdir -p $BT
          echo "sysroot: $(ls -la $SYSROOT/ | head -3)"

      - name: Prepare build-tools (download official prebuilts)
        run: |
          # 官方构建需要 build-tools (make, mkbootimg 等)。优先从源码树自带获取
          echo "=== 检查源码树自带 build-tools ==="
          find kernel_platform/build -maxdepth 3 -name 'mkbootimg*' 2>/dev/null | head -3
          find kernel_platform/prebuilts -maxdepth 3 -type d -name 'build-tools*' 2>/dev/null | head -3
          ls kernel_platform/build/kernel/build-tools/path/linux-x86/bin/ 2>/dev/null | head -10 || echo "(无自带 build-tools bin)"

      - name: Initialize KernelSU git (required by Kbuild)
        run: |
          cd kernel_platform/KernelSU
          if [ ! -d .git ]; then
            git init -q
            git add -A
            git -c user.email=build@local -c user.name=build commit -qm "KernelSU init for Kbuild"
          fi
          echo "KernelSU git ready: $(git rev-list --count HEAD 2>/dev/null || echo 0) commits"

      - name: Build kernel (official flow)
        id: build
        run: |
          cd kernel_platform
          export PATH="$PWD/prebuilts/clang/host/linux-x86/clang-r450784e/bin:$PATH"
          export SOURCE_DATE_EPOCH=1758042739
          export KBUILD_BUILD_TIMESTAMP='Tue Sep 16 15:52:19 UTC 2025'
          export BUILD_CONFIG=msm-kernel/build.config.msm.kalama.le
          export VARIANT=gki
          export KMI_ENFORCED=0
          export KMI_SYMBOL_LIST_STRICT_MODE=0
          export OUT_DIR="$PWD/out"
          export DIST_DIR="$PWD/dist"

          # 检查入口
          echo "=== 入口检查 ==="
          ls -la build/build.sh 2>/dev/null || ls -la build/kernel/build.sh 2>/dev/null
          which clang || true
          clang --version 2>/dev/null | head -1 || true

          echo "=== 开始构建 $(date) ==="
          bash build/build.sh 2>&1 | tee /tmp/build.log
          RC=${PIPESTATUS[0]}
          echo "=== 构建结束 $(date) RC=$RC ==="
          echo "BUILD_RC=$RC" >> $GITHUB_ENV
          if [ $RC -ne 0 ]; then
            echo "=== 失败日志尾部(最后 100 行)==="
            tail -100 /tmp/build.log
            exit $RC
          fi

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore

      - name: Verify kernel output
        run: |
          IMG=$(find kernel_platform/out -name 'Image' -path '*gki_kernel*' | head -1)
          if [ -z "$IMG" ]; then
            echo "=== 构建失败,无 Image ==="
            tail -100 /tmp/build.log
            exit 1
          fi
          echo "Image: $IMG ($(stat -c%s $IMG) bytes)"
          strings "$IMG" | grep -E '^5\.15\.170' | head -1
          echo "SUSFS symbols: $(strings "$IMG" | grep -c susfs)"

      - name: Package boot image
        run: |
          IMG=$(find kernel_platform/out -name 'Image' -path '*gki_kernel*' | head -1)
          python3 - << 'EOF'
          import struct, sys
          img = sys.argv[1]
          out = 'boot_XQ-DQ72_susfs.img'
          PAGE = 4096
          with open(img, 'rb') as f:
              kernel = f.read()
          hdr = bytearray(1584)
          hdr[0:8] = b'ANDROID!'
          struct.pack_into('<I', hdr, 8, len(kernel))
          struct.pack_into('<I', hdr, 16, 0)
          struct.pack_into('<I', hdr, 40, 4)
          def pad_to(n, s):
              return ((s + n - 1) // n) * n
          boot = bytearray()
          boot += hdr
          boot += b'\x00' * (PAGE - len(hdr))
          boot += kernel
          boot += b'\x00' * (pad_to(PAGE, len(kernel)) - len(kernel))
          with open(out, 'wb') as f:
              f.write(boot)
          print(f'boot: {out} ({len(boot)} bytes)')
          EOF "$IMG"

      - name: Upload boot image artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot_XQ-DQ72_susfs
          path: boot_XQ-DQ72_susfs.img
          if-no-files-found: error

      - name: Create Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: boot_XQ-DQ72_susfs.img
          generate_release_notes: true
