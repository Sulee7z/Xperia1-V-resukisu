name: Build Xperia 1 V Kernel

on:
  workflow_dispatch:
    inputs:
      variant:
        description: '构建变体 (gki/consolidate)'
        required: false
        default: 'gki'
  push:
    branches: [master]

jobs:
  build-kernel:
    name: Build Kernel (5.15.170 + ReSukiSU + SUSFS)
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            bc bison flex cpio git libssl-dev libelf-dev \
            python3 python3-pip device-tree-compiler \
            gcc g++ make rsync zip zstd lz4 xz-utils \
            openssl dwarves libncurses-dev ccache curl wget
          python3 -m pip install --quiet pyelftools

      - name: Install clang-17 toolchain (prebuilts symlinks target /usr/bin/*-17)
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq clang-17 lld-17 llvm-17
          # 确保所有软链目标存�?          BIN=kernel_platform/prebuilts/clang/host/linux-x86/clang-r450784e/bin
          for t in clang clang++ ld.lld llvm-ar llvm-as llvm-cov llvm-dis llvm-dwarfdump \
                    llvm-link llvm-mc llvm-nm llvm-objcopy llvm-objdump llvm-opt \
                    llvm-profdata llvm-ranlib llvm-readelf llvm-size llvm-strings llvm-strip; do
            if [ -L "$BIN/$t" ]; then
              target=$(readlink "$BIN/$t")
              if [ ! -e "$target" ]; then
                echo "BROKEN: $t -> $target"
              fi
            fi
          done
          clang --version | head -1
          ld.lld --version | head -1

      - name: Prepare sysroot symlink
        run: |
          SYSROOT=kernel_platform/build/kernel/build-tools/sysroot
          sudo mkdir -p $SYSROOT
          [ -L $SYSROOT/usr ] || sudo ln -sfn /usr $SYSROOT/usr

      - name: Initialize KernelSU git (required by Kbuild)
        run: |
          cd kernel_platform/KernelSU
          if [ ! -d .git ]; then
            git init -q
            git add -A
            git -c user.email=build@local -c user.name=build commit -qm "KernelSU init for Kbuild"
          fi

      - name: Build kernel (official flow)
        id: build
        run: |
          cd kernel_platform
          export PATH="$PWD/prebuilts/clang/host/linux-x86/clang-r450784e/bin:$PATH"
          export SOURCE_DATE_EPOCH=1758042739
          export KBUILD_BUILD_TIMESTAMP='Tue Sep 16 15:52:19 UTC 2025'
          export BUILD_CONFIG=msm-kernel/build.config.msm.kalama.le
          export VARIANT=gki
          export KMI_ENFORCED=0
          export KMI_SYMBOL_LIST_STRICT_MODE=0
          export OUT_DIR="$PWD/out"
          export DIST_DIR="$PWD/dist"

          echo "clang check: $(which clang) $(clang --version | head -1)"
          bash build/build.sh || echo "build.sh exited non-zero (msm-kernel stage warning is expected)"

          IMG=$(find out -name 'Image' -path '*gki_kernel*' | head -1)
          if [ -z "$IMG" ]; then
            echo "::error::Image not generated! Build failed."
            exit 1
          fi
          echo "Image OK: $IMG ($(stat -c%s $IMG) bytes)"
          echo "IMAGE_PATH=$IMG" >> $GITHUB_ENV

      - name: Verify kernel features
        run: |
          IMG=$(find kernel_platform/out -name 'Image' -path '*gki_kernel*' | head -1)
          strings "$IMG" | grep -E '^5\.15\.170' | head -1
          echo "SUSFS symbols: $(strings "$IMG" | grep -c susfs)"
          echo "KSU symbols: $(strings "$IMG" | grep -c ksu_handle)"

      - name: Package boot image
        run: |
          IMG=$(find kernel_platform/out -name 'Image' -path '*gki_kernel*' | head -1)
          python3 - << 'EOF'
          import struct, sys
          img = sys.argv[1]
          out = 'boot_XQ-DQ72_susfs.img'
          PAGE = 4096
          with open(img, 'rb') as f:
              kernel = f.read()
          hdr = bytearray(1584)
          hdr[0:8] = b'ANDROID!'
          struct.pack_into('<I', hdr, 8, len(kernel))
          struct.pack_into('<I', hdr, 16, 0)
          struct.pack_into('<I', hdr, 40, 4)
          def pad_to(n, s):
              return ((s + n - 1) // n) * n
          boot = bytearray()
          boot += hdr
          boot += b'\x00' * (PAGE - len(hdr))
          boot += kernel
          boot += b'\x00' * (pad_to(PAGE, len(kernel)) - len(kernel))
          with open(out, 'wb') as f:
              f.write(boot)
          print(f'boot: {out} ({len(boot)} bytes)')
          EOF "$IMG"

      - name: Upload boot image artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot_XQ-DQ72_susfs
          path: boot_XQ-DQ72_susfs.img
          if-no-files-found: error

      - name: Create Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: boot_XQ-DQ72_susfs.img
          generate_release_notes: true
