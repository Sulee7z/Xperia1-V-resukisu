name: Build Xperia 1 V Kernel

on:
  workflow_dispatch:
    inputs:
      variant:
        description: '构建变体 (gki/consolidate)'
        required: false
        default: 'gki'
  push:
    branches: [master]

jobs:
  build-kernel:
    name: Build Kernel (5.15.170 + ReSukiSU + SUSFS)
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            bc bison flex cpio git libssl-dev libelf-dev \
            python3 python3-pip device-tree-compiler \
            gcc g++ make rsync zip zstd lz4 xz-utils \
            openssl dwarves libncurses-dev ccache curl wget
          python3 -m pip install --quiet pyelftools

      - name: Environment self-check
        run: |
          echo "=== 环境自检 ==="
          echo "--- 工具 ---"
          for t in bash make gcc clang flex bison bc lz4 zstd xz python3 dwarves; do
            if command -v $t >/dev/null 2>&1; then echo "OK: $t"; else echo "MISSING: $t"; fi
          done
          echo "--- 源码入口 ---"
          ls -la kernel_platform/build/build.sh
          readlink kernel_platform/build/build.sh || true
          ls kernel_platform/build/kernel/build.sh && echo "build.sh OK"
          echo "--- clang ---"
          ls kernel_platform/prebuilts/clang/host/linux-x86/ 2>/dev/null
          echo "--- build-tools ---"
          ls kernel_platform/build/kernel/build-tools/path/linux-x86/bin/ 2>/dev/null | head -5 || echo "无自带 build-tools bin"
          echo "--- sysroot ---"
          ls -la kernel_platform/build/kernel/build-tools/sysroot/ 2>/dev/null | head -3

      - name: Prepare sysroot symlink
        run: |
          SYSROOT=kernel_platform/build/kernel/build-tools/sysroot
          sudo mkdir -p $SYSROOT
          [ -L $SYSROOT/usr ] || sudo ln -sfn /usr $SYSROOT/usr
          ls -la $SYSROOT/

      - name: Initialize KernelSU git (required by Kbuild)
        run: |
          cd kernel_platform/KernelSU
          if [ ! -d .git ]; then
            git init -q
            git add -A
            git -c user.email=build@local -c user.name=build commit -qm "KernelSU init for Kbuild"
          fi

      - name: Build kernel (official flow, verbose on failure)
        id: build
        run: |
          cd kernel_platform
          export PATH="$PWD/prebuilts/clang/host/linux-x86/clang-r450784e/bin:$PATH"
          export SOURCE_DATE_EPOCH=1758042739
          export KBUILD_BUILD_TIMESTAMP='Tue Sep 16 15:52:19 UTC 2025'
          export BUILD_CONFIG=msm-kernel/build.config.msm.kalama.le
          export VARIANT=gki
          export KMI_ENFORCED=0
          export KMI_SYMBOL_LIST_STRICT_MODE=0
          export OUT_DIR="$PWD/out"
          export DIST_DIR="$PWD/dist"

          echo "=== 开始构建 $(date) ==="
          # 直接输出到 stdout(不重定向),失败时页面可见完整日志
          bash build/build.sh
          RC=$?
          echo "=== 构建结束 $(date) RC=$RC ==="
          exit $RC

      - name: Verify kernel output
        run: |
          IMG=$(find kernel_platform/out -name 'Image' -path '*gki_kernel*' | head -1)
          if [ -z "$IMG" ]; then
            echo "构建失败: 无 Image"
            exit 1
          fi
          echo "Image: $IMG ($(stat -c%s $IMG) bytes)"
          strings "$IMG" | grep -E '^5\.15\.170' | head -1
          echo "SUSFS symbols: $(strings "$IMG" | grep -c susfs)"

      - name: Package boot image
        run: |
          IMG=$(find kernel_platform/out -name 'Image' -path '*gki_kernel*' | head -1)
          python3 - << 'EOF'
          import struct, sys
          img = sys.argv[1]
          out = 'boot_XQ-DQ72_susfs.img'
          PAGE = 4096
          with open(img, 'rb') as f:
              kernel = f.read()
          hdr = bytearray(1584)
          hdr[0:8] = b'ANDROID!'
          struct.pack_into('<I', hdr, 8, len(kernel))
          struct.pack_into('<I', hdr, 16, 0)
          struct.pack_into('<I', hdr, 40, 4)
          def pad_to(n, s):
              return ((s + n - 1) // n) * n
          boot = bytearray()
          boot += hdr
          boot += b'\x00' * (PAGE - len(hdr))
          boot += kernel
          boot += b'\x00' * (pad_to(PAGE, len(kernel)) - len(kernel))
          with open(out, 'wb') as f:
              f.write(boot)
          print(f'boot: {out} ({len(boot)} bytes)')
          EOF "$IMG"

      - name: Upload boot image artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot_XQ-DQ72_susfs
          path: boot_XQ-DQ72_susfs.img
          if-no-files-found: error

      - name: Create Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: boot_XQ-DQ72_susfs.img
          generate_release_notes: true
