name: Build kernel boot image (XQ-DQ72, 550M GPU cap)

on:
  workflow_dispatch:
  push:
    paths:
      - 'kernel_platform/**'
      - '.github/workflows/build-kernel.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (host tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils build-essential flex bison libssl-dev libelf-dev \
            bc python3 lz4 xz-utils device-tree-compiler dwarves

      - name: Fetch Google clang-r450784e (exact GKI 5.15 toolchain)
        run: |
          mkdir -p $HOME/clang
          curl -L --fail -o /tmp/clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r450784e.tar.gz"
          tar -xzf /tmp/clang.tar.gz -C $HOME/clang
          ls -la $HOME/clang/bin/clang
          $HOME/clang/bin/clang --version | head -2

      - name: Prepare out tree with saved config
        working-directory: kernel_platform
        run: |
          # ReSukiSU Kbuild requires KSU_SRC/../.git (KernelSU as git repo)
          cd KernelSU
          git init -q
          git add -A
          git -c user.email=ci@local -c user.name=ci commit -qm init
          cd ..
          mkdir -p out/gki_kernel/common
          # config extracted from the verified-on-device kernel (IKCONFIG).
          # CI rebuilds exactly this kernel: GPU 550M cap, 680M only on jank.
          cp config_launchboost_550_base.config out/gki_kernel/common/.config
          make -C common O=$PWD/out/gki_kernel/common ARCH=arm64 LLVM=1 \
            olddefconfig 2>&1 | tail -5
          grep -E '^CONFIG_(PERF_MGR|KSU|LTO_CLANG_THIN|ARM64)=' \
            out/gki_kernel/common/.config

      - name: Build kernel Image
        working-directory: kernel_platform
        run: |
          export PATH=$HOME/clang/bin:$PATH
          echo "=== 资源 before ==="
          df -h . ; free -m
          make -C common O=$PWD/out/gki_kernel/common ARCH=arm64 LLVM=1 \
            -j$(nproc) Image > kbuild.log 2>&1
          rc=$?
          echo "MAKE_RC=$rc"
          echo "=== 资源 after ==="
          df -h . ; free -m
          echo "=== 错误行 ==="
          grep -nE 'error:|Error [0-9]|No space|Killed|out of memory|fatal|undefined reference|ld.lld|LLVM ERROR' kbuild.log | head -25
          echo "=== tail ==="
          tail -15 kbuild.log
          exit $rc

      - name: Upload kbuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kbuild-log
          path: kernel_platform/kbuild.log

      - name: Build Image.lz4
        working-directory: kernel_platform
        run: |
          export PATH=$HOME/clang/bin:$PATH
          make -C common O=$PWD/out/gki_kernel/common ARCH=arm64 LLVM=1 \
            Image.lz4 2>&1 | tail -5 || true
          ls -la out/gki_kernel/common/arch/arm64/boot/Image.lz4 2>/dev/null || true

      - name: Package boot img (swap kernel into boot template)
        run: |
          python3 - <<'EOF'
          import struct
          src = 'kernel_platform/boot_base.img'
          newk = 'kernel_platform/out/gki_kernel/common/arch/arm64/boot/Image'
          out = 'boot_launchboost_550.img'
          old = open(src, 'rb').read()
          header = old[:4096]
          assert header[:8] == b'ANDROID!', 'bad boot template'
          k = open(newk, 'rb').read()
          h = bytearray(header)
          struct.pack_into('<I', h, 8, len(k))
          img = bytes(h) + k
          open(out, 'wb').write(img)
          print('boot img bytes:', len(img))
          print('kernel bytes :', len(k))
          assert len(img) < 100663296, 'exceeds boot_a partition (96MB)'
          print('OK: fits boot_a partition')
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: boot_launchboost_550
          path: |
            boot_launchboost_550.img
            kernel_platform/out/gki_kernel/common/arch/arm64/boot/Image
            kernel_platform/out/gki_kernel/common/arch/arm64/boot/Image.lz4
            kernel_platform/out/gki_kernel/common/.config
            kernel_platform/kbuild.log

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: boot_launchboost_550.img
          generate_release_notes: true